# VoiceChat Configuration
# All runtime parameters live here — no hardcoded values in pipeline code.

# ─── Audio ────────────────────────────────────────────────────────────────────
audio:
  sample_rate: 16000          # Hz — faster-whisper expects 16kHz
  channels: 1
  chunk_size: 1024            # frames per buffer (PyAudio)
  input_device_index: null    # null = system default mic
  output_device_index: null   # null = system default speaker

# ─── VAD ──────────────────────────────────────────────────────────────────────
vad:
  threshold: 0.5              # Silero VAD confidence threshold (0.0–1.0)
  min_speech_duration_ms: 250 # ignore speech shorter than this (filters clicks)
  min_silence_duration_ms: 700 # silence this long = end of user turn
  window_size_samples: 512    # Silero VAD window size

# ─── STT ──────────────────────────────────────────────────────────────────────
stt:
  model_size: "small"          # faster-whisper: tiny/base/small/medium
  compute_type: "int8"        # int8 = fastest CPU inference
  language: "en"
  beam_size: 1                # lower = faster, slightly less accurate
  device: "cuda"               # "cpu" or "cuda"

# ─── LLM ──────────────────────────────────────────────────────────────────────
llm:
  model: "qwen2.5:3b"         # Ollama model tag — pull this first
  # fallback: "phi3.5:mini"   # smaller model if qwen is too slow on hardware
  base_url: "http://localhost:11434"
  temperature: 0.7
  max_tokens: 256             # keep responses short for latency
  stream: true                # must be true for overlapped TTS

# ─── Memory ───────────────────────────────────────────────────────────────────
memory:
  short_term:
    max_turns: 10             # rolling window of last N conversation turns
  long_term:
    store_path: "data/memory/faiss_index"
    facts_db_path: "data/memory/facts.sqlite"
    embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
    top_k: 3                  # how many facts to retrieve per query
    similarity_threshold: 0.6 # minimum cosine similarity to include a fact

# ─── TTS ──────────────────────────────────────────────────────────────────────
tts:
  engine: "kokoro"            # "kokoro" or "piper"
  kokoro:
    voice: "af_heart"         # Kokoro voice preset
    speed: 1.0
  piper:
    model_path: "data/models/piper/en_US-lessac-medium.onnx"
    config_path: "data/models/piper/en_US-lessac-medium.onnx.json"

# ─── Guardrails ───────────────────────────────────────────────────────────────
guardrails:
  enabled: true
  config_path: "guardrails/config.yml"
  check_input: true
  check_output: true
  check_dialogue: false       # false = skip dialogue rails (latency budget)

# ─── Fallback ─────────────────────────────────────────────────────────────────
fallback:
  llm_first_token_timeout_ms: 800   # trigger filler phrase if LLM hasn't responded by this
  filler_phrases:
    - "Let me think about that for a moment..."
    - "That's a good question, give me just a second..."
    - "Hmm, let me work through that..."
    - "One moment while I put that together..."
    - "Sure, just a brief pause while I think..."

# ─── Pipeline ─────────────────────────────────────────────────────────────────
pipeline:
  prewarm_llm: true           # send dummy prompt at startup to avoid cold-start
  prewarm_prompt: "Hello"

# ─── Logging ──────────────────────────────────────────────────────────────────
logging:
  level: "INFO"               # DEBUG for development, INFO for demo
  log_latency: true           # print per-stage timing to console
  log_file: null              # null = console only
