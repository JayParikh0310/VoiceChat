<!-- Web mic UI — mic button, status indicator, audio visualizer, latency readout -->
<!-- Implementation: Part 8 (stretch goal), redesigned in Part 9 -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VoiceChat</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main>
    <div class="brand">
      <span class="brand-mark"></span>
      <span class="brand-name">VoiceChat</span>
    </div>

    <div class="stage">
      <canvas id="visualizer" width="360" height="360" aria-hidden="true"></canvas>
      <button id="session-btn" data-state="idle" aria-label="Start conversation">
        <svg class="mic-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z" />
          <path d="M19 11a1 1 0 0 0-2 0 5 5 0 0 1-10 0 1 1 0 0 0-2 0 7 7 0 0 0 6 6.93V20H9a1 1 0 0 0 0 2h6a1 1 0 0 0 0-2h-2v-2.07A7 7 0 0 0 19 11z" />
        </svg>
      </button>
    </div>

    <p id="status">Click to start</p>
    <pre id="latency" hidden></pre>
  </main>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
